services:

  broker:
    image: apache/kafka:4.2.0
    container_name: rapidex-broker
    hostname: rapidex-broker

    ports:
      - "9092:9092"

    environment:
      # =========================
      # KRaft (modo Kafka moderno)
      # =========================
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@rapidex-broker:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      # Listeners (IMPORTANTE)
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093"

      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://rapidex-broker:9092"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      # Cluster
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"

      # Topics internos
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"

    networks:
      - rapidex-net


  spark:
    build: .
    container_name: rapidex-spark

    depends_on:
      - broker

    volumes:
      - ./:/app

    working_dir: /app

    environment:
      PYTHONUNBUFFERED: "1"

    command: tail -f /dev/null

    networks:
      - rapidex-net


  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: rapidex-namenode
    hostname: rapidex-namenode

    environment:
      CLUSTER_NAME: rapidex
      CORE_CONF_fs_defaultFS: hdfs://rapidex-namenode:9000
      HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check: "false"

    ports:
      - "9870:9870"
      - "9000:9000"

    volumes:
      - namenode_data:/hadoop/dfs/name

    networks:
      - rapidex-net


  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: rapidex-datanode
    hostname: rapidex-datanode

    environment:
      SERVICE_PRECONDITION: "rapidex-namenode:9870"
      CORE_CONF_fs_defaultFS: hdfs://rapidex-namenode:9000

    ports:
      - "9864:9864"

    volumes:
      - datanode_data:/hadoop/dfs/data

    depends_on:
      - namenode

    networks:
      - rapidex-net


networks:
  rapidex-net:
    driver: bridge


volumes:
  namenode_data:
  datanode_data: